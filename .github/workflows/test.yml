name: Campus Agent Tests
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest    
    steps:
    - name: Checkout repository
        uses: actions/checkout@v4

    - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
    - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r campus_agent/requirements.txt
          pip install pytest
    - name: Run tests
        working-directory: campus_agent
        run: python -m pytest test_agent.py -v